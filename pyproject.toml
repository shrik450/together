[project]
name = "together"
version = "0.1.0"
description = "A webapp for relationship activities"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard,sqlalchemy]>=2.21.1",
    "apscheduler>=4.0.0a6",
    "sqlalchemy>=2.0.48",
    "aiosqlite>=0.21.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.0.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.58.0",
    "zendriver>=0.17.1",
    "trafilatura>=2.3.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:The garbage collector is trying to clean up non-checked-in connection .*:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Litestar's migration template prefixes filenames with the date.
"migrations/versions/*" = ["N999"]
